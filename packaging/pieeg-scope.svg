  <rect x="6" y="6" width="116" height="116" rx="20" fill="#1a1a19"/>
  <rect x="6" y="6" width="116" height="116" rx="20" fill="none" stroke="#333331" stroke-width="2"/>
  <!-- faint grid -->
  <g stroke="#2a2a29" stroke-width="1">
    <line x1="20" y1="64" x2="108" y2="64"/>
    <line x1="42" y1="24" x2="42" y2="104"/>
    <line x1="64" y1="24" x2="64" y2="104"/>
    <line x1="86" y1="24" x2="86" y2="104"/>
